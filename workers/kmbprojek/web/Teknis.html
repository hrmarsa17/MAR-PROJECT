  <script>
    var PAGE_TOKEN = '<?= token ?>';
    var DATA = null;
    /* ── TOKEN DITEMPELKAN DI SINI, DAN HANYA DI SINI ───────────────────
       SEBAB (1 Sep 2026, ditemukan dari URL yang dipentalkan):
       Tautan menu dulu menulis tokennya dari server begini —

           ?page=hm<?= token ? '&token=' + token : '' ?>

       — dan tanda '&' itu tidak selamat sampai ke DOM. Yang tiba di server
       adalah page = "hm&token=52fdb..." sebagai SATU nilai, karena '&' dan
       '=' berubah jadi %26 dan %3d di dalam tautannya. Nama halaman jadi tak
       dikenal, dan pemakainya mendarat di halaman awal perannya - untuk L1
       itu Approvals. Persis gejalanya: dari Teknis ke Koreksi HM, terlempar
       ke Approvals.

       Pola itu HANYA ada di Teknis.html dan Hm.html. Lima halaman lama tidak
       pernah menulis token di dalam href sama sekali - mereka menyerahkannya
       ke penempel seperti ini. Sekarang kedua halaman baru ikut begitu.

       Jadi href di atas bersih: cuma ?page=xxx, tanpa satu pun '&' yang bisa
       rusak. Token ditambahkan di sini dengan encodeURIComponent, lewat DOM,
       tanpa melewati escaping HTML sama sekali.

       Bedanya dengan fixer di halaman lama: yang ini hanya MENAMBAHKAN token,
       tidak membangun ulang URL dari getScriptUrl(). Alamat /exec tetap yang
       tertulis di tautannya, jadi tak ada kemungkinan tersasar ke deployment
       lain. */
    (function tempelToken() {
      if (!PAGE_TOKEN) return;
      function pasang() {
        var a = document.querySelectorAll('a[href*="/macros/s/"]');
        for (var i = 0; i < a.length; i++) {
          var h = a[i].getAttribute('href') || '';
          if (/token(=|%3d)/i.test(h)) continue;   /* %3d = '=' yang sudah ter-encode */
          a[i].setAttribute('href', h + (h.indexOf('?') !== -1 ? '&' : '?') +
                            'token=' + encodeURIComponent(PAGE_TOKEN));
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', pasang);
      } else { pasang(); }
    })();

    /* ── DATA CONTOH MENYALA SEJAK HALAMAN DIBUKA ──────────────────────────
       Diminta Gabriel (2 Sep 2026) untuk masa peragaan ke user: layar ini
       harus langsung berisi begitu dibuka, bukan kosong menunggu diklik.

       Catatan yang saya tinggalkan dengan sadar: ini kebalikan dari alasan
       saya semula membuatnya mati. Selama ia menyala secara bawaan, siapa pun
       yang membuka halaman ini melihat angka karangan LEBIH DULU daripada
       angka sungguhan — termasuk orang yang tidak diberi tahu. Yang menjaganya
       tinggal spanduk ungu itu, dan spanduk tak pernah sekuat kebiasaan.

       Kembalikan ke false begitu peragaan selesai. Satu kata, di baris ini. */
    var MODE_DEMO = true;

    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    /* Kosong ditulis "–", bukan 0. Nol adalah pengukuran; kekosongan adalah
       ketiadaan pengukuran, dan keduanya tak boleh terlihat sama. */
    function ang(v) {
      if (v === null || v === undefined || String(v).replace(/^\s+|\s+$/g,'') === '') {
        return '<span class="kosong">–</span>';
      }
      return esc(v);
    }
    var BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agt','Sep','Okt','Nov','Des'];
    function tgl(v) {
      if (!v) return '<span class="kosong">–</span>';
      var d = new Date(v);
      if (isNaN(d.getTime())) return esc(v);
      return d.getDate() + ' ' + BLN[d.getMonth()] + ' ' + d.getFullYear();
    }
    /* Tanggal SAJA tidak cukup untuk kolom "Tercatat": dalam satu hari sebuah
       posisi bisa dicatat beberapa kali, dan yang ingin diketahui pembaca
       adalah apakah angka di sebelahnya masih segar. Jam menjawab itu; tanggal
       tidak. */
    function jam(v) {
      if (!v) return '<span class="kosong">–</span>';
      var d = new Date(v);
      if (isNaN(d.getTime())) return esc(v);
      function dua(n) { return (n < 10 ? '0' : '') + n; }
      return d.getDate() + ' ' + BLN[d.getMonth()] + ' ' + d.getFullYear() +
             '<span style="color:#94a3b8;">, ' + dua(d.getHours()) + ':' + dua(d.getMinutes()) + '</span>';
    }
    function pilihTab(nama) {
      var t = document.querySelectorAll('.tab[data-tab]');
      for (var i = 0; i < t.length; i++) t[i].classList.toggle('active', t[i].getAttribute('data-tab') === nama);
      var p = document.querySelectorAll('.panel');
      for (var j = 0; j < p.length; j++) p[j].classList.toggle('active', p[j].id === 'p-' + nama);
    }
    function hampa(judul, isi) {
      return '<div class="hampa"><div class="hampa-judul">' + esc(judul) + '</div>' + esc(isi) + '</div>';
    }

    var DUNIA = 'tyre';
    var DATA_F = null;

    /* Dua dunia, dua panggilan terpisah. Field tak pernah diminta selama orang
       melihat Tyre — halaman ini dibuka juga oleh yang cuma mengurus ban. */
    function pilihDunia(n) {
      DUNIA = n;
      document.getElementById('dTyre').classList.toggle('on', n === 'tyre');
      document.getElementById('dField').classList.toggle('on', n === 'field');
      document.getElementById('duniaTyre').style.display  = (n === 'tyre')  ? '' : 'none';
      document.getElementById('duniaField').style.display = (n === 'field') ? '' : 'none';
      document.querySelector('.tabs').style.display = (n === 'tyre') ? '' : 'none';

      if (n === 'field') { muatField(); return; }

      /* Spanduk data contoh milik Tyre dibersihkan dulu, lalu digambar ulang
         dari data yang datang. Field menggambar spanduknya sendiri di dalam
         wadahnya, jadi tanpa ini spanduk Tyre bisa tertinggal menggantung di
         atas layar Field. */
      document.getElementById('spandukDemo').innerHTML = '';
      /* Tyre dimuat ulang kalau belum pernah dimuat ATAU kalau mode contohnya
         sudah tak sesuai lagi — inilah yang membuat saklar tadi benar-benar
         berlaku untuk dunia yang sedang tidak terbuka. */
      if (!DATA || !!DATA.demo !== MODE_DEMO) { muat(); return; }
      gambar();
    }

    function muatField() {
      var w = document.getElementById('duniaField');
      if (DATA_F && DATA_F.demo === MODE_DEMO) { gambarField(); return; }
      w.innerHTML = hampa('Memuat...', '');
      google.script.run
        .withSuccessHandler(function(r) {
          if (!r || !r.success) { w.innerHTML = hampa('Tidak bisa memuat', (r && r.error ? r.error.message : '')); return; }
          DATA_F = r.data; DATA_F.demo = MODE_DEMO;
          gambarField();
        })
        .withFailureHandler(function(e) { w.innerHTML = hampa('Sambungan terputus', e.message); })
        .handleDataDashboardField({token: PAGE_TOKEN, demo: MODE_DEMO});
    }

    /* MTBF selalu tampil bersama seberapa bisa dipercaya. Angka yang bersandar
       pada dua bacaan HM lalu direntangkan ke sebulan akan terlihat sama
       meyakinkannya dengan angka yang bersandar pada tiga puluh bacaan - dan
       itulah yang membuat orang percaya pada yang tidak pantas dipercaya. */
    function mtbfSel(u) {
      if (u.mtbf === null || u.mtbf === undefined) {
        var sebab = (u.hm_bacaan < 2) ? 'HM belum cukup'
                  : (u.hm_cara === 'tipis') ? 'HM terlalu jarang' : 'HM belum ada';
        return '<span class="kosong" title="Bacaan HM: ' + (u.hm_bacaan || 0) +
               ' &middot; melingkupi ' + (u.hm_liputan || 0) + '% periode">' + sebab + '</span>';
      }
      var tanda = '';
      if (u.hm_cara === 'sebagian') {
        tanda = '<span class="hm-sebagian" title="Bacaan HM melingkupi ' + u.hm_liputan +
                '% periode - sisanya ditaksir">~</span>';
      }
      return u.mtbf + tanda +
        '<div class="hm-mutu">' + u.hm_bacaan + ' bacaan &middot; ' + u.hm_liputan + '%' +
        (u.hm_dibuang ? ' &middot; <span class="hm-buang" title="Bacaan yang lebih kecil daripada sebelumnya - salah ketik atau panel jam diganti">' +
          u.hm_dibuang + ' dibuang</span>' : '') + '</div>';
    }

    function pct(v) { return (v === null || v === undefined) ? '<span class="kosong">-</span>'
                             : (Math.round(v * 1000) / 10).toFixed(1) + '%'; }

    function gambarField() {
      var d = DATA_F, R = d.ringkas;
      var h = '';

      if (d.demo) {
        h += '<div class="demo-banner">&#9888; <b>INI DATA CONTOH - BUKAN KENYATAAN.</b><br>' +
             'Angkanya dicontoh dari laporan PA Juli supaya bentuknya dikenali, tapi tak satu pun ' +
             'berasal dari pekerjaan orang sungguhan. Tidak ada baris yang tersimpan.</div>';
      }

      h += '<div class="stat-row">' +
        stat(pct(R.pa), 'PA rata-rata') +
        stat(R.unit, 'Unit tercatat') +
        stat(R.kejadian, 'Kejadian BD') +
        stat(R.total_bd + ' j', 'Total downtime') +
        stat((R.mttr === null ? '-' : R.mttr + ' j'), 'MTTR') +
        stat((R.mtbf === null ? '-' : R.mtbf + ' j'), 'MTBF') +
        '</div>';

      h += '<div class="catatan"><b>PA = (MOHH &minus; Total BD) &divide; MOHH.</b> ' +
        'MOHH ' + d.mohh + ' jam = ' + d.hari + ' hari &times; 24 - unit dianggap seharusnya siap ' +
        'tiap jam, tiap hari. Yang mengurangi: <span class="mono">UB0</span> (dikerjakan), ' +
        '<span class="mono">UB1</span> (menunggu mekanik), <span class="mono">SB0</span> ' +
        '(perawatan terjadwal). Periode: <b>' + esc(d.periode) + '</b>.</div>';

      if (d.terbuka && d.terbuka.length) {
        h += '<div class="kartu"><div class="kartu-judul">Masih tercatat rusak</div>' +
             '<div class="kartu-sub">Selama belum ditutup, jamnya terus bertambah dan PA-nya terus turun.</div>';
        for (var t = 0; t < d.terbuka.length; t++) {
          var o = d.terbuka[t];
          h += '<div class="terbuka-row"><span><b>' + esc(o.unit) + '</b> - sejak ' + tgl(o.down) +
               (o.wo ? ' &middot; ' + o.wo + ' WO' : ' &middot; belum ada WO') + '</span>' +
               '<span><b>' + o.jam + ' jam</b></span></div>';
        }
        h += '</div>';
      }

      // Tabel utama - satu baris per unit, terparah di atas.
      h += '<div class="kartu"><div class="kartu-judul">Per unit</div>' +

    /* GRAFIK GARIS, SVG murni.
       Sumbu Y dimulai dari NOL, bukan dari nilai terkecil. Sumbu yang dipotong
       membuat kenaikan tiga persen terlihat seperti dua kali lipat - cara
       tercepat membuat grafik berbohong tanpa satu angka pun salah. */
    function grafikMinggu(mg) {
      if (!mg || mg.length < 2) return '';
      var W = 720, H = 200, kiri = 34, bawah = 26, atas = 12, kanan = 8;
      var lebar = W - kiri - kanan, tinggi = H - atas - bawah;

      var maks = 1;
      for (var i = 0; i < mg.length; i++) {
        maks = Math.max(maks, mg[i].inspeksi, mg[i].removeinstal, mg[i].problem);
      }
      maks = Math.ceil(maks / 5) * 5;

      function X(i) { return kiri + (lebar * i / (mg.length - 1)); }
      function Y(v) { return atas + tinggi - (tinggi * v / maks); }

      var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="200" style="display:block;">';

      for (var g = 0; g <= 4; g++) {
        var v = Math.round(maks * g / 4), y = Y(v);
        svg += '<line x1="' + kiri + '" y1="' + y + '" x2="' + (W - kanan) + '" y2="' + y +
               '" stroke="#f1f5f9" stroke-width="1"/>' +
               '<text x="' + (kiri - 6) + '" y="' + (y + 3.5) + '" text-anchor="end" ' +
               'font-size="9" fill="#cbd5e1">' + v + '</text>';
      }

      var seri = [
        {k: 'inspeksi',     w: '#94a3b8', n: 'Inspeksi'},
        {k: 'removeinstal', w: '#0ea5e9', n: 'Remove/Instal'},
        {k: 'problem',      w: '#ef4444', n: 'Problem'}
      ];
      for (var t = 0; t < seri.length; t++) {
        var d = '', titik = '';
        for (var j = 0; j < mg.length; j++) {
          var x = X(j), y2 = Y(mg[j][seri[t].k]);
          d += (j ? ' L' : 'M') + x.toFixed(1) + ',' + y2.toFixed(1);
          titik += '<circle cx="' + x.toFixed(1) + '" cy="' + y2.toFixed(1) +
                   '" r="2.6" fill="' + seri[t].w + '"><title>' + esc(mg[j].label) + ' - ' +
                   esc(seri[t].n) + ': ' + mg[j][seri[t].k] + '</title></circle>';
        }
        svg += '<path d="' + d + '" fill="none" stroke="' + seri[t].w +
               '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' + titik;
      }

      for (var l = 0; l < mg.length; l++) {
        svg += '<text x="' + X(l).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" ' +
               'font-size="9.5" fill="#94a3b8">' + esc(mg[l].label) + '</text>';
      }
      svg += '</svg>';

      var leg = '<div class="legenda">';
      for (var m = 0; m < seri.length; m++) {
        leg += '<span><i style="background:' + seri[m].w + '"></i>' + esc(seri[m].n) + '</span>';
      }
      leg += '</div>';

      var awal = mg[0], akhir = mg[mg.length - 1];
      return '<div class="kartu">' +
        '<div class="kartu-judul">Pergerakan ' + mg.length + ' minggu terakhir</div>' +
        '<div class="kartu-sub">Mg 1 = ' + esc(awal.rentang) + ' &nbsp;&middot;&nbsp; Mg ' +
        mg.length + ' = ' + esc(akhir.rentang) + ' (minggu berjalan)</div>' +
        svg + leg + '</div>';
    }

    /* Grafik kecil dalam sel tabel. Bentuk garisnya memberi tahu apa yang tak
       bisa dikatakan dua angka: aus yang merata terlihat lurus, aus yang
       mendadak terlihat patah. */
    function spark(titik, kritis) {
      if (!titik || titik.length < 2) return '<span class="kosong">-</span>';
      var W = 82, H = 22, p = 2;
      var min = titik[0].rtd, maks = titik[0].rtd;
      for (var i = 1; i < titik.length; i++) {
        if (titik[i].rtd < min) min = titik[i].rtd;
        if (titik[i].rtd > maks) maks = titik[i].rtd;
      }
      var rentang = (maks - min) || 1;
      var d = '';
      for (var j = 0; j < titik.length; j++) {
        var x = p + (W - 2 * p) * j / (titik.length - 1);
        var y = p + (H - 2 * p) * (1 - (titik[j].rtd - min) / rentang);
        d += (j ? ' L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
      }
      var warna = kritis ? '#dc2626' : '#64748b';
      return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">' +
             '<path d="' + d + '" fill="none" stroke="' + warna + '" stroke-width="1.6" ' +
             'stroke-linejoin="round" stroke-linecap="round"/></svg>';
    }

          '<td>' + (k.perkiraan_ganti ? esc(k.perkiraan_ganti) : '<span class="kosong">perlu 2 catatan</span>') + '</td>' +
          '<td class="num">' + ang(k.pressure) + '</td>' +

      h += '</tbody></table></div>' +
        '<div class="catatan" style="margin:1rem 0 0;">' +
        '<b>Dari mana angka “Perkiraan ganti”.</b> Dasarnya <b>umur pakai dalam kilometer</b>, bukan RTD:<br>' +
        '&nbsp;&nbsp;umur pakai = KM unit sekarang − KM saat tyre itu dipasang<br>' +
        '&nbsp;&nbsp;sisa KM &nbsp;&nbsp;= umur sasaran − umur pakai<br>' +
        '&nbsp;&nbsp;tanggal &nbsp;&nbsp;&nbsp;= hari ini + (sisa KM ÷ kilometer per hari unit itu)<br>' +
        'Kilometer per hari diturunkan dari tyre itu sendiri (umur KM ÷ umur hari), bukan rata-rata ' +
        'armada — unit yang jarang jalan akan meleset jauh kalau dipukul rata.<br><br>' +
        '<b>Kenapa KM, bukan RTD.</b> RTD hanya bergerak kalau ada yang mengukurnya; KM bertambah sendiri ' +
        'selama unit bekerja. Ramalan yang bersandar pada pengukuran sukarela akan berhenti bergerak ' +
        'begitu orang lupa mengukur — dan diam itu terbaca sebagai “belum aus”. RTD tetap ditampilkan: ' +
        'ia satu-satunya yang memberi tahu keadaan <b>sekarang</b>.<br><br>' +
        'Tetap <b>ramalan, bukan janji</b>: ia menganggap unit akan terus bekerja sekeras kemarin.</div>';
      document.getElementById('p-kondisi').innerHTML = h;

    /* ── LIFE TIME ───────────────────────────────────────────────────────
       Tab yang menjawab pertanyaan pembelian, bukan pertanyaan perawatan:
       "merk mana yang paling awet di medan kita".

       HANYA tyre yang SUDAH DILEPAS yang dihitung. Yang masih terpasang umurnya
       masih berjalan; memasukkannya akan menarik rata-rata ke bawah dan membuat
       setiap merk terlihat lebih buruk daripada kenyataannya. */
    function gambarLife() {
      var L = DATA.life || {};
      var target = DATA.target_life_km || 0;

      if (!L.jumlah) {
        document.getElementById('p-life').innerHTML =
          '<div class="catatan">Umur pakai baru bisa dihitung kalau <b>KM Unit</b> diisi mekanik ' +
          'saat mengirim WO tyre, dan tyre-nya sudah pernah <b>dipasang lalu dilepas</b> — ' +
          'umurnya = KM saat dilepas − KM saat dipasang.</div>' +
          hampa('Belum ada tyre yang selesai umurnya', 'Terisi begitu ada tyre yang dipasang lalu dilepas dengan KM tercatat di keduanya.');
        return;
      }

      var kartu = '<div class="stat-row" style="margin-bottom:1rem;">' +
        stat(L.rata + ' KM', 'Rata-rata umur pakai') +
        stat(L.jumlah, 'Tyre selesai umurnya') +
        stat(target ? (target + ' KM') : '–', 'Umur sasaran') +
        (target ? stat(Math.round(L.rata * 100 / target) + '%', 'Rata-rata thd sasaran') : '') +
        '</div>';

      if (!target) {
        kartu += '<div class="catatan">⚠️ <b>Umur sasaran belum ditentukan</b> ' +
          '(<code>tyre_target_life_km</code> di Config_BaseSettings). Umur yang tercapai tetap ' +
          'terukur, tapi tak ada pembandingnya — “4.000 KM” itu bagus atau buruk hanya bisa ' +
          'dijawab kalau ada sasarannya.</div>';
      }

      var perMerk = [];
      for (var i = 0; i < L.per_merk.length; i++) {
        perMerk.push({nama: L.per_merk[i].nama + ' (' + L.per_merk[i].jumlah + ')', jumlah: L.per_merk[i].rata});
      }
      var perPos = [];
      for (var j = 0; j < L.per_posisi.length; j++) {
        perPos.push({nama: 'Posisi ' + L.per_posisi[j].pos + ' (' + L.per_posisi[j].jumlah + ')', jumlah: L.per_posisi[j].rata});
      }

      var tbl = '<div class="scroll"><table><thead><tr><th>Serial No</th><th>Merk / Pattern</th>' +
        '<th>Size</th><th class="num">Umur pakai</th><th class="num">Hari</th>' +
        '<th>Problem</th><th>Dilepas</th></tr></thead><tbody>';
      for (var k = 0; k < L.selesai.length; k++) {
        var e = L.selesai[k];
        var lewat = target && e.life_km >= target;
        tbl += '<tr><td><b>' + esc(e.sn) + '</b></td>' +
          '<td>' + ang(((e.merk || '') + ' ' + (e.pattern || '')).replace(/^\s+|\s+$/g,'')) + '</td>' +
          '<td>' + ang(e.size) + '</td>' +
          '<td class="num"><b' + (lewat ? ' style="color:#15803d;"' : '') + '>' + e.life_km + ' KM</b></td>' +
          '<td class="num">' + ang(e.hari) + '</td>' +
          '<td>' + ang(e.problem) + '</td>' +
          '<td>' + tgl(e.turun_at) + '</td></tr>';
      }
      tbl += '</tbody></table></div>';

      document.getElementById('p-life').innerHTML = kartu +
        '<div class="kartu-judul">Rata-rata umur pakai menurut merk / pattern</div>' +
        '<div class="kartu-sub">Angka dalam kurung = berapa tyre yang jadi dasarnya. Satu tyre bukan bukti.</div>' +
        batang(perMerk, 'nama', '') +
        '<div class="kartu-judul" style="margin-top:1.6rem;">Menurut posisi</div>' +
        '<div class="kartu-sub">Posisi yang umurnya jauh lebih pendek biasanya soal medan atau beban, bukan soal tyre-nya.</div>' +
        batang(perPos, 'nama', '') +
        '<div class="kartu-judul" style="margin-top:1.6rem;">Tyre yang sudah selesai umurnya</div>' +
        '<div class="kartu-sub">Terpanjang di atas. Hijau = mencapai atau melewati umur sasaran.</div>' + tbl +
        '<div class="catatan" style="margin-top:1rem;">Hanya tyre yang <b>sudah dilepas</b> yang masuk ' +
        'tabel ini. Yang masih terpasang umurnya masih berjalan; memasukkannya akan menarik rata-rata ' +
        'ke bawah dan membuat setiap merk terlihat lebih buruk daripada kenyataannya.<br>' +
        'Pasangan pasang–lepas dicocokkan lewat <b>SN</b>. Tyre yang catatan pemasangannya di luar ' +
        'jendela pindai tidak muncul di sini — diabaikan, bukan ditaksir, karena satu angka mustahil ' +
        'merusak kepercayaan pada seluruh tabel.</div>';
    }

    /* ── RIWAYAT PER UNIT (no lambung) ──────────────────────────────────
       Tab lain menjawab "posisi mana yang paling gawat di SELURUH armada".
       Yang ini menjawab pertanyaan yang berbeda dan sama seringnya ditanyakan:
       "unit ini bagaimana?" — saat sebuah unit masuk workshop, yang dicari
       adalah seluruh riwayat tyre-nya di satu tempat, bukan barisnya tersebar
       di antara unit lain.

       Seluruhnya dirakit dari data yang SUDAH ada di layar; tidak ada
       perjalanan tambahan ke server saat mengganti unit. */
    var UNIT_PILIH = '';

    function daftarUnit() {
      var peta = {}, out = [];
      var sumber = (DATA.kondisi || []).concat(DATA.riwayat || []);
      for (var i = 0; i < sumber.length; i++) {
        var u = sumber[i].unit;
        if (!u || peta[u]) continue;
        peta[u] = 1;
        out.push({id: u, label: sumber[i].unit_label || u});
      }
      out.sort(function(a, b) { return String(a.label).localeCompare(String(b.label)); });
      return out;
    }

    function pilihUnit(v) { UNIT_PILIH = v; gambarUnit(); }

    function gambarUnit() {
      var du = daftarUnit();
      if (!du.length) {
        document.getElementById('p-unit').innerHTML =
          hampa('Belum ada unit tercatat', 'Terisi begitu ada WO tyre yang dikirim mekanik.');
        return;
      }
      if (!UNIT_PILIH || !du.some(function(x) { return x.id === UNIT_PILIH; })) UNIT_PILIH = du[0].id;

      var sel = '<div style="margin-bottom:1rem;"><label class="kartu-judul" style="display:block;margin-bottom:.4rem;">No lambung / unit</label>' +
        '<select class="tab" style="min-width:240px;cursor:pointer;" onchange="pilihUnit(this.value)">';
      for (var i = 0; i < du.length; i++) {
        sel += '<option value="' + esc(du[i].id) + '"' + (du[i].id === UNIT_PILIH ? ' selected' : '') +
               '>' + esc(du[i].label) + '</option>';
      }
      sel += '</select></div>';

      var pos = [];
      for (var k = 0; k < DATA.kondisi.length; k++) {
        if (DATA.kondisi[k].unit === UNIT_PILIH) pos.push(DATA.kondisi[k]);
      }
      pos.sort(function(a, b) { return a.pos - b.pos; });

      var tblPos;
      if (!pos.length) {
        tblPos = hampa('Belum ada inspeksi untuk unit ini', '');
      } else {
        tblPos = '<div class="scroll"><table><thead><tr><th>Pos</th><th>SN terpasang</th>' +
          '<th class="num">RTD</th><th>Jejak RTD</th><th class="num">Umur pakai</th>' +
          '<th>Perkiraan ganti</th><th>Tercatat</th></tr></thead><tbody>';
        for (var q = 0; q < pos.length; q++) {
          var r = pos[q];
          tblPos += '<tr' + (r.kritis ? ' class="kritis"' : '') + '>' +
            '<td class="num">' + r.pos + '</td>' +
            '<td>' + ang(r.sn_terpasang) + '</td>' +
            '<td class="num rtd">' + ang(r.rtd) + '</td>' +
            '<td>' + spark(r.titik, r.kritis) + '</td>' +
            '<td class="num">' + (r.life_km === null || r.life_km === undefined
                ? '<span class="kosong">KM belum diisi</span>'
                : (r.life_km + ' KM' + (r.umur_hari !== null ? '<span style="color:#94a3b8;"> · hari ke-' + r.umur_hari + '</span>' : ''))) + '</td>' +
            '<td>' + (r.perkiraan_ganti ? esc(r.perkiraan_ganti) : '<span class="kosong">perlu 2 catatan</span>') + '</td>' +
            '<td>' + jam(r.dicatat_at) + '</td></tr>';
        }
        tblPos += '</tbody></table></div>';
      }

      var riw = [];
      for (var m = 0; m < DATA.riwayat.length; m++) {
        if (DATA.riwayat[m].unit === UNIT_PILIH) riw.push(DATA.riwayat[m]);
      }
      var tblRiw;
      if (!riw.length) {
        tblRiw = hampa('Belum ada Remove / Instal untuk unit ini', '');
      } else {
        tblRiw = '<div class="scroll"><table><thead><tr><th>Tanggal</th><th>Pos</th>' +
          '<th>SN dilepas</th><th>Problem</th><th>Remarks</th><th>SN dipasang</th><th>Lokasi</th>' +
          '</tr></thead><tbody>';
        for (var n = 0; n < riw.length; n++) {
          var y = riw[n];
          tblRiw += '<tr><td>' + jam(y.at) + '</td><td class="num">' + y.pos + '</td>' +
            '<td>' + ang(y.sn_turun) + '</td><td>' + ang(y.problem) + '</td>' +
            '<td>' + ang(y.remarks) + '</td><td>' + ang(y.sn_naik) + '</td>' +
            '<td>' + ang(y.lokasi) + '</td></tr>';
        }
        tblRiw += '</tbody></table></div>';
      }

      document.getElementById('p-unit').innerHTML = sel +
        '<div class="kartu-judul">Keadaan tiap posisi</div>' +
        '<div class="kartu-sub">Hanya posisi yang pernah diinspeksi yang muncul.</div>' + tblPos +
        '<div class="kartu-judul" style="margin-top:1.6rem;">Riwayat Remove / Instal unit ini</div>' +
        '<div class="kartu-sub">Terbaru di atas.</div>' + tblRiw;
    }

    setelSaklarDemo();
    muat();
  </script>
</body>
</html>
