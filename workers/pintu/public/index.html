<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abadi Operation</title>
<meta name="description" content="Pintu masuk Abadi Operation. Token menentukan aplikasi yang Anda buka.">
<style>
  :root {
    --bg: #f4f5f7; --kartu: #ffffff; --teks: #1d2433; --redup: #5b6475; --garis: #d9dde5;
    --utama: #1f5fbf; --utama-teks: #ffffff; --salah: #b42318; --salah-bg: #fdecea; --ok: #1e6b45;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --kartu: #1b2029; --teks: #e7eaf0; --redup: #9aa3b2; --garis: #2c3340;
      --utama: #4c8dff; --utama-teks: #0b1220; --salah: #ffb4ab; --salah-bg: #3a1f1d; --ok: #7fd3a7;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--teks);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px;
  }
  main { width: 100%; max-width: 380px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: 0.01em; }
  .sub { color: var(--redup); margin: 0 0 20px; font-size: 0.95rem; }
  .kartu { background: var(--kartu); border: 1px solid var(--garis); border-radius: 12px; padding: 20px; }
  label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
  input {
    width: 100%; font: inherit; font-size: 1rem; padding: 12px; border-radius: 8px;
    border: 1px solid var(--garis); background: var(--bg); color: var(--teks);
  }
  input:focus { outline: 2px solid var(--utama); outline-offset: 1px; }
  button {
    width: 100%; margin-top: 12px; font: inherit; font-weight: 600; font-size: 1rem; padding: 12px;
    border: 0; border-radius: 8px; background: var(--utama); color: var(--utama-teks); cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: progress; }
  button.kedua { background: transparent; color: var(--utama); border: 1px solid var(--garis); }
  .pilih-ket { display: block; font-weight: 400; font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }
  #pesan { margin-top: 14px; font-size: 0.92rem; min-height: 1.3em; }
  #pesan.salah { color: var(--salah); background: var(--salah-bg); padding: 10px 12px; border-radius: 8px; }
  #pesan.ok { color: var(--ok); }
  #lanjut, #pilih { display: none; }
  #lanjut { margin-bottom: 16px; }
  #salam { font-weight: 600; margin: 0 0 2px; }
  #salamRumah { color: var(--redup); margin: 0 0 4px; font-size: 0.92rem; }
  .tautan { background: none; border: 0; color: var(--redup); font-weight: 400; font-size: 0.85rem; text-decoration: underline; padding: 8px 0 0; }
  .kaki { color: var(--redup); font-size: 0.8rem; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Abadi Operation</h1>
  <p class="sub" id="sub">Masukkan token akses Anda.</p>
  <div class="kartu">
    <div id="lanjut">
      <button type="button" class="kedua" id="tombolLanjut"></button>
    </div>
    <form id="formulir" autocomplete="off">
      <label for="token">Token akses</label>
      <input id="token" name="token" type="text" inputmode="text" autocapitalize="off" spellcheck="false" required>
      <button type="submit" id="tombolMasuk">Masuk</button>
    </form>
    <!-- Sesudah token dikenali: tawarkan pilihan Aplikasi (PWA) atau Web Biasa -->
    <div id="pilih">
      <p id="salam"></p>
      <p id="salamRumah"></p>
      <button type="button" id="tombolAplikasi">📱 Aplikasi PWA<span class="pilih-ket">untuk HP / lapangan (offline-first)</span></button>
      <button type="button" class="kedua" id="tombolWeb">🖥️ Web Biasa<span class="pilih-ket">untuk laptop / desktop (menu lengkap)</span></button>
      <button type="button" class="tautan" id="tombolGanti">Bukan Anda? Ganti token</button>
    </div>
    <div id="pesan" role="status" aria-live="polite"></div>
  </div>
  <p class="kaki">Token menentukan aplikasi yang Anda buka.</p>
</main>
<script>
(function () {
  var KUNCI_RUMAH = 'abadi_rumah_terakhir'; // hanya alamat dan nama rumah, TIDAK PERNAH token
  var form = document.getElementById('formulir');
  var input = document.getElementById('token');
  var tombol = document.getElementById('tombolMasuk');
  var pesan = document.getElementById('pesan');
  var kotakLanjut = document.getElementById('lanjut');
  var kotakPilih = document.getElementById('pilih');

  function tampil(teks, jenis) { pesan.textContent = teks || ''; pesan.className = jenis || ''; }
  function kembaliKeForm() {
    kotakPilih.style.display = 'none';
    form.style.display = '';
    document.getElementById('sub').textContent = 'Masukkan token akses Anda.';
    input.value = '';
    tombol.disabled = false;
    tampil('');
    input.focus();
  }

  // Rumah terakhir: satu ketukan untuk kembali ke aplikasi rumah (sesinya disimpan aplikasi itu).
  try {
    var terakhir = JSON.parse(localStorage.getItem(KUNCI_RUMAH) || 'null');
    if (terakhir && /^https:\/\/[a-z0-9-]+\.abadiops\.com\/$/.test(terakhir.alamat)) {
      var t = document.getElementById('tombolLanjut');
      t.textContent = 'Lanjutkan ke ' + terakhir.nama;
      t.onclick = function () { location.href = terakhir.alamat; };
      kotakLanjut.style.display = 'block';
    }
  } catch (e) {}

  function tawarkanPilihan(token, j) {
    form.style.display = 'none';
    kotakLanjut.style.display = 'none';
    document.getElementById('sub').textContent = 'Pilih mode akses yang Anda inginkan:';
    document.getElementById('salam').textContent = 'Halo' + (j.nama ? ', ' + j.nama : '') + '!';
    document.getElementById('salamRumah').textContent = j.nama_rumah;
    
    var tApl = document.getElementById('tombolAplikasi');
    var tWeb = document.getElementById('tombolWeb');

    tApl.onclick = function () {
      try { localStorage.setItem(KUNCI_RUMAH, JSON.stringify({ alamat: j.alamat_rumah, nama: j.nama_rumah })); } catch (e) {}
      tampil('Membuka aplikasi PWA ' + j.nama_rumah + '…', 'ok');
      location.replace(j.alamat_rumah + '#token=' + encodeURIComponent(token));
    };

    if (j.web_rumah) {
      tWeb.style.display = '';
      tWeb.onclick = function () {
        tampil('Membuka web ' + j.nama_rumah + '…', 'ok');
        location.replace(j.web_rumah + '?token=' + encodeURIComponent(token));
      };
    } else {
      tWeb.style.display = 'none';
    }

    tampil('');
    kotakPilih.style.display = 'block';
  }

  function masuk(token) {
    tombol.disabled = true;
    tampil('Memeriksa token di semua rumah… (bisa sampai 15 detik)');
    fetch('/api/pintu', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.success && j.alamat_rumah) {
        tawarkanPilihan(token, j);
        return;
      }
      tombol.disabled = false;
      tampil((j && j.error) || 'Token tidak dikenal / nonaktif', 'salah');
    }).catch(function () {
      tombol.disabled = false;
      tampil('Tidak bisa menghubungi server. Periksa sinyal, lalu coba lagi.', 'salah');
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var token = input.value.trim();
    if (!token) { tampil('Silakan masukkan token akses.', 'salah'); return; }
    masuk(token);
  });
  document.getElementById('tombolGanti').onclick = kembaliKeForm;

  // Tautan berisi token (?token=… dari fitur "salin token", atau #token=…): token dihapus
  // dari alamat lalu langsung diperiksa.
  var dariAlamat = '';
  try {
    var m = /(?:^#|&)token=([^&]+)/.exec(location.hash || '');
    dariAlamat = m ? decodeURIComponent(m[1]) : (new URLSearchParams(location.search).get('token') || '');
  } catch (e) {}
  if (dariAlamat.trim()) {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    input.value = dariAlamat.trim();
    masuk(dariAlamat.trim());
  }
})();
</script>
</body>
</html>
