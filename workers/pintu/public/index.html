<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abadi Operation</title>
<meta name="description" content="Pintu masuk Abadi Operation. Token menentukan aplikasi yang Anda buka.">
<style>
  :root {
    --bg: #f4f5f7; --kartu: #ffffff; --teks: #1d2433; --redup: #5b6475; --garis: #d9dde5;
    --utama: #1f5fbf; --utama-teks: #ffffff; --salah: #b42318; --salah-bg: #fdecea; --ok: #1e6b45;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --kartu: #1b2029; --teks: #e7eaf0; --redup: #9aa3b2; --garis: #2c3340;
      --utama: #4c8dff; --utama-teks: #0b1220; --salah: #ffb4ab; --salah-bg: #3a1f1d; --ok: #7fd3a7;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--teks);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px;
  }
  main { width: 100%; max-width: 380px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: 0.01em; }
  .sub { color: var(--redup); margin: 0 0 20px; font-size: 0.95rem; }
  .kartu { background: var(--kartu); border: 1px solid var(--garis); border-radius: 12px; padding: 20px; }
  label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
  input {
    width: 100%; font: inherit; font-size: 1rem; padding: 12px; border-radius: 8px;
    border: 1px solid var(--garis); background: var(--bg); color: var(--teks);
  }
  input:focus { outline: 2px solid var(--utama); outline-offset: 1px; }
  button {
    width: 100%; margin-top: 12px; font: inherit; font-weight: 600; font-size: 1rem; padding: 12px;
    border: 0; border-radius: 8px; background: var(--utama); color: var(--utama-teks); cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: progress; }
  button.kedua { background: transparent; color: var(--utama); border: 1px solid var(--garis); }
  .pilih-ket { display: block; font-weight: 400; font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }
  .pesan { margin-top: 14px; font-size: 0.92rem; min-height: 1.3em; }
  .pesan.salah { color: var(--salah); background: var(--salah-bg); padding: 10px 12px; border-radius: 8px; }
  .pesan.ok { color: var(--ok); }
  .kotak-lanjut { margin-bottom: 16px; }
  .salam { font-weight: 600; margin: 0 0 2px; }
  .salam-rumah { color: var(--redup); margin: 0 0 4px; font-size: 0.92rem; }
  .tautan { background: none; border: 0; color: var(--redup); font-weight: 400; font-size: 0.85rem; text-decoration: underline; padding: 8px 0 0; }
  .kaki { color: var(--redup); font-size: 0.8rem; margin-top: 16px; text-align: center; }
  .react-badge { display: inline-block; font-size: 0.72rem; padding: 2px 6px; border-radius: 4px; background: rgba(76, 141, 255, 0.15); color: var(--utama); margin-left: 6px; vertical-align: middle; font-weight: 500; }
</style>
<!-- React 18 & ReactDOM 18 UMD -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  var KUNCI_RUMAH = 'abadi_rumah_terakhir';
  var e = React.createElement;
  var useState = React.useState;
  var useEffect = React.useEffect;
  var useRef = React.useRef;

  function AppLoginAbadiops() {
    var [token, setToken] = useState('');
    var [loading, setLoading] = useState(false);
    var [pesan, setPesan] = useState({ teks: '', jenis: '' });
    var [terakhir, setTerakhir] = useState(null);
    var [pilihan, setPilihan] = useState(null);
    var inputRef = useRef(null);

    // Muat riwayat rumah terakhir dari localStorage
    useEffect(function () {
      try {
        var item = JSON.parse(localStorage.getItem(KUNCI_RUMAH) || 'null');
        if (item && /^https:\/\/[a-z0-9-]+\.abadiops\.com\/$/.test(item.alamat)) {
          setTerakhir(item);
        }
      } catch (err) {}

      // Tangani token dari URL hash (#token=...) atau query string (?token=...)
      var dariAlamat = '';
      try {
        var m = /(?:^#|&)token=([^&]+)/.exec(location.hash || '');
        dariAlamat = m ? decodeURIComponent(m[1]) : (new URLSearchParams(location.search).get('token') || '');
      } catch (err) {}
      
      if (dariAlamat.trim()) {
        try { history.replaceState(null, '', location.pathname); } catch (err) {}
        var tClean = dariAlamat.trim();
        setToken(tClean);
        jalankanLogin(tClean);
      }
    }, []);

    function jalankanLogin(tokenAkses) {
      var t = (tokenAkses !== undefined ? tokenAkses : token).trim();
      if (!t) {
        setPesan({ teks: 'Silakan masukkan token akses.', jenis: 'salah' });
        return;
      }

      setLoading(true);
      setPesan({ teks: 'Memeriksa token di semua rumah… (bisa sampai 15 detik)', jenis: '' });

      fetch('/api/pintu', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: t })
      })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.success && data.alamat_rumah) {
          setLoading(false);
          setPilihan({
            token: t,
            nama: data.nama || '',
            nama_rumah: data.nama_rumah || '',
            alamat_rumah: data.alamat_rumah || '',
            web_rumah: data.web_rumah || ''
          });
          setPesan({ teks: '', jenis: '' });
          return;
        }
        setLoading(false);
        setPesan({ teks: (data && data.error) || 'Token tidak dikenal / nonaktif', jenis: 'salah' });
      })
      .catch(function () {
        setLoading(false);
        setPesan({ teks: 'Tidak bisa menghubungi server. Periksa sinyal, lalu coba lagi.', jenis: 'salah' });
      });
    }

    function handleBukaAplikasiPWA() {
      if (!pilihan) return;
      try {
        localStorage.setItem(KUNCI_RUMAH, JSON.stringify({
          alamat: pilihan.alamat_rumah,
          nama: pilihan.nama_rumah
        }));
      } catch (err) {}
      setPesan({ teks: 'Membuka aplikasi PWA ' + pilihan.nama_rumah + '…', jenis: 'ok' });
      location.replace(pilihan.alamat_rumah + '#token=' + encodeURIComponent(pilihan.token));
    }

    function handleBukaWebBiasa() {
      if (!pilihan || !pilihan.web_rumah) return;
      setPesan({ teks: 'Membuka web ' + pilihan.nama_rumah + '…', jenis: 'ok' });
      location.replace(pilihan.web_rumah + '?token=' + encodeURIComponent(pilihan.token));
    }

    function handleGantiToken() {
      setPilihan(null);
      setToken('');
      setLoading(false);
      setPesan({ teks: '', jenis: '' });
      setTimeout(function () {
        if (inputRef.current) inputRef.current.focus();
      }, 50);
    }

    return e('main', null,
      e('h1', null,
        'Abadi Operation',
        e('span', { className: 'react-badge' }, 'React')
      ),
      e('p', { className: 'sub' },
        pilihan ? 'Pilih mode akses yang Anda inginkan:' : 'Masukkan token akses Anda.'
      ),
      e('div', { className: 'kartu' },
        // Tombol Lanjut ke Rumah Terakhir (jika ada sesi sebelumnya)
        (!pilihan && terakhir) ? e('div', { className: 'kotak-lanjut' },
          e('button', {
            type: 'button',
            className: 'kedua',
            onClick: function () { location.href = terakhir.alamat; }
          }, 'Lanjutkan ke ' + terakhir.nama)
        ) : null,

        // Form Login Token
        (!pilihan) ? e('form', {
          autoComplete: 'off',
          onSubmit: function (evt) {
            evt.preventDefault();
            jalankanLogin();
          }
        },
          e('label', { htmlFor: 'tokenInput' }, 'Token akses'),
          e('input', {
            id: 'tokenInput',
            name: 'token',
            type: 'text',
            ref: inputRef,
            inputMode: 'text',
            autoCapitalize: 'off',
            spellCheck: 'false',
            required: true,
            value: token,
            onChange: function (evt) { setToken(evt.target.value); },
            disabled: loading
          }),
          e('button', {
            type: 'submit',
            disabled: loading
          }, loading ? 'Memeriksa…' : 'Masuk')
        ) : null,

        // Pilihan PWA vs Web Biasa (setelah token valid)
        pilihan ? e('div', null,
          e('p', { className: 'salam' }, 'Halo' + (pilihan.nama ? ', ' + pilihan.nama : '') + '!'),
          e('p', { className: 'salam-rumah' }, pilihan.nama_rumah),
          e('button', {
            type: 'button',
            onClick: handleBukaAplikasiPWA
          },
            '📱 Aplikasi PWA',
            e('span', { className: 'pilih-ket' }, 'untuk HP / lapangan (offline-first)')
          ),
          pilihan.web_rumah ? e('button', {
            type: 'button',
            className: 'kedua',
            onClick: handleBukaWebBiasa
          },
            '🖥️ Web Biasa',
            e('span', { className: 'pilih-ket' }, 'untuk laptop / desktop (menu lengkap)')
          ) : null,
          e('button', {
            type: 'button',
            className: 'tautan',
            onClick: handleGantiToken
          }, 'Bukan Anda? Ganti token')
        ) : null,

        // Notifikasi / Pesan Status
        pesan.teks ? e('div', {
          className: 'pesan ' + (pesan.jenis || ''),
          role: 'status',
          'aria-live': 'polite'
        }, pesan.teks) : null
      ),
      e('p', { className: 'kaki' }, 'Token menentukan aplikasi yang Anda buka.')
    );
  }

  var rootEl = document.getElementById('root');
  if (rootEl && window.ReactDOM && ReactDOM.createRoot) {
    var root = ReactDOM.createRoot(rootEl);
    root.render(e(AppLoginAbadiops));
  }
})();
</script>
</body>
</html>
