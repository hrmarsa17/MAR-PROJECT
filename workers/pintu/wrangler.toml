# Pintu Abadi Operation: halaman netral di abadiops.com. Mengenali rumah dari token
# (ping ke GAS semua rumah sekaligus), lalu mengantar pengguna ke aplikasi rumahnya.
# Bagian bersama (AGENTS.md §2). Keputusan: docs/KEPUTUSAN.md 28 Okt 2026.
name = "abadiops-pintu"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Akun Cloudflare kawanabadigrup. Dikunci supaya deploy tidak pernah nyasar ke akun lain.
account_id = "9273ece6d47a3bb103159295c10ce9e6"

# abadiops.com dipindah ke Worker ini lewat dashboard, SESUDAH pintu terbukti berjalan
# (lihat docs/PROGRES.md). Jangan menambah `routes` di sini sebelum itu.

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"

# Daftar rumah. Ini konfigurasi, bukan kode (haram hardcode, AGENTS.md §5): menambah rumah,
# misalnya kmbbupr, cukup menambah satu baris di sini lalu deploy. Alamat GAS disalin dari
# GAS_URLS di worker.js; alamat aplikasi = <kode>.abadiops.com; web = halaman web GAS rumah itu
# (sekarang sama dengan alamat API-nya), dibuka dengan ?token= (keputusan 29 Okt nomor 10).
[vars]
RUMAH = [
  { kode = "kmbprojek", nama = "KMB Projek", gas = "https://script.google.com/macros/s/AKfycbxh4086qGRZGDqAvdpO7UDdsvqk1Li9NR2rFZLlyVS6gS1zpGrZdcEsb_z-HzKOY02Y/exec", alamat = "https://kmbprojek.abadiops.com/", web = "https://kmbprojek.abadiops.com/web" },
  { kode = "sum", nama = "SUM", gas = "https://script.google.com/macros/s/AKfycbzB5EUJlpGRaDTFvfr3bl117hd_Oa2k4seCecTYy4Ct8_oYRefu8U9BqG6zu3M-BoFS/exec", alamat = "https://sum.abadiops.com/", web = "https://sum.abadiops.com/web" },
  { kode = "kmbtra", nama = "KMB TRA", gas = "https://script.google.com/macros/s/AKfycbwlwlQvOGVF6FdKkYRNlbgdJCets5L-0AfufMB4_79_HzvoQkeE9aZAqkKZiXCZHXnG6Q/exec", alamat = "https://kmbtra.abadiops.com/", web = "https://kmbtra.abadiops.com/web" },
]

[observability]
enabled = true

# Panggung Latihan (Staging) - docs/GEDUNG-DAN-STAGING.md §2
[env.staging]
name = "abadiops-pintu-staging"
workers_dev = true

services = [
  { binding = "GAS_TIRUAN", service = "abadiops-gas-tiruan" }
]

[env.staging.vars]
RUMAH = [
  { kode = "kmbprojek", nama = "KMB Projek (Staging)", gas = "https://abadiops-gas-tiruan.kawanabadigrup.workers.dev/kmbprojek", alamat = "https://staging-kmbprojek.abadiops.com/", web = "https://staging-kmbprojek.abadiops.com/web" },
  { kode = "sum", nama = "SUM (Staging)", gas = "https://abadiops-gas-tiruan.kawanabadigrup.workers.dev/sum", alamat = "https://staging-sum.abadiops.com/", web = "https://staging-sum.abadiops.com/web" },
  { kode = "kmbtra", nama = "KMB TRA (Staging)", gas = "https://abadiops-gas-tiruan.kawanabadigrup.workers.dev/kmbtra", alamat = "https://staging-kmbtra.abadiops.com/", web = "https://staging-kmbtra.abadiops.com/web" },
]
