# Rumah SUM V2: Worker yang menyajikan PWA SUM dan meneruskan setiap panggilan API ke GAS SUM.
# Rumah: sum · Pemegang: Gabriel · Tahap 3 (Pintu): 100% diteruskan ke GAS. Saklar: gas.
# Penjelasan: workers/sum/README.md
name = "abadiops-sum"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Alamat utama (keputusan Gabriel 28 Okt malam, pilihan A). *.workers.dev dicegat DNS
# sebagian provider internet, sedangkan domain sendiri tidak. Cloudflare membuat DNS dan
# sertifikatnya otomatis. workers.dev tetap aktif sementara untuk perangkat uji.
routes = [
  { pattern = "sum.abadiops.com", custom_domain = true }
]

# Akun Cloudflare kawanabadigrup. Dikunci supaya deploy tidak pernah nyasar ke akun lain
# yang kebetulan sedang login di laptop (misalnya akun pribadi untuk Rembes). Kalau login
# yang aktif bukan kawanabadigrup, deploy ditolak, tidak dikirim ke akun yang salah.
account_id = "9273ece6d47a3bb103159295c10ce9e6"

# File PWA SUM (salinan 1:1 dari mar-sum-offline v45, hanya alamat API yang diganti).
# html_handling "none": /index.html disajikan langsung (200, tanpa redirect), sama seperti
# GitHub Pages. Service worker PWA menyimpan ./index.html ke cache dan memakainya saat
# offline; jawaban hasil redirect tidak boleh dipakai untuk navigasi.
[assets]
directory = "../../pwa/sum"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"

[vars]
RUMAH = "sum"
SAKLAR = "gas"
# Web app GAS produksi SUM V2 (script 1k_A_KER…). Alamat ini juga tertulis di PWA lama.
GAS_URL = "https://script.google.com/macros/s/AKfycbzB5EUJlpGRaDTFvfr3bl117hd_Oa2k4seCecTYy4Ct8_oYRefu8U9BqG6zu3M-BoFS/exec"
SUPABASE_URL = "https://dnnqrslftndcbmnvuveb.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_HgQd9sXhK3-CrFyUId-LEw_q_ah2S0O"
STORAGE_MODE = "GAS"

[observability]
enabled = true
