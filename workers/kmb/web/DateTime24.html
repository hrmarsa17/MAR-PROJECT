<script>
/**
 * PICKER TANGGAL & JAM 24 JAM — satu definisi untuk semua halaman web.
 * Sisipkan dengan <?!= include('DateTime24') ?> di dalam <body>.
 *
 * KENAPA tidak memakai <input type="datetime-local">:
 * format 12/24 jam pada picker bawaan ditentukan LOCALE PERANGKAT, bukan HTML.
 * Di ponsel yang locale-nya Inggris, picker memunculkan AM/PM — bentuk yang
 * tidak dipakai di lapangan sini, dan sumber salah isi yang mahal (jam 13.00
 * terbaca "1", lalu tersimpan jadi 01.00 → actual_hours meleset 12 jam, dan itu
 * jalur uang). Tidak ada atribut HTML/CSS untuk memaksanya, jadi bagian jamnya
 * dibuat sendiri: 00–23 dan 00–59, selalu 24 jam apa pun setelan ponselnya.
 * Bagian TANGGAL tetap <input type="date"> — di sana tidak ada urusan AM/PM.
 *
 * BENTUK NILAI tidak berubah: hasilnya ditulis ke <input type="hidden"> ber-ID
 * SAMA seperti dulu, dalam format "YYYY-MM-DDTHH:MM" (identik datetime-local).
 * Jadi seluruh kode yang MEMBACA `.value` tidak perlu diubah sama sekali.
 * Yang MENULIS wajib lewat dtSet(id, nilai) supaya kontrol di layar ikut pindah.
 */

/** HTML satu kontrol. `id` = id input hidden yang dipakai kode lama. */
function dtHtml(id, kelasInput) {
  var k = kelasInput || 'form-input';
  return '<input type="hidden" id="' + id + '">' +
    '<div class="dt24" data-dt="' + id + '">' +
      '<input type="date" class="' + k + ' dtTgl" aria-label="Tanggal">' +
      '<select class="' + k + ' dtJam" aria-label="Jam"></select>' +
      '<span class="dtTitik">:</span>' +
      '<select class="' + k + ' dtMnt" aria-label="Menit"></select>' +
    '</div>';
}

function _dt2(n) { return (n < 10 ? '0' : '') + n; }

/** Isi opsi jam/menit & pasang pendengar. Aman dipanggil berulang. */
function dtPasang(root) {
  var grup = (root || document).querySelectorAll('.dt24');
  for (var i = 0; i < grup.length; i++) {
    var g = grup[i];
    if (g.getAttribute('data-siap') === '1') continue;
    g.setAttribute('data-siap', '1');

    var oJam = '<option value="">--</option>';
    for (var h = 0; h < 24; h++) oJam += '<option value="' + _dt2(h) + '">' + _dt2(h) + '</option>';
    g.querySelector('.dtJam').innerHTML = oJam;

    var oMnt = '<option value="">--</option>';
    for (var m = 0; m < 60; m++) oMnt += '<option value="' + _dt2(m) + '">' + _dt2(m) + '</option>';
    g.querySelector('.dtMnt').innerHTML = oMnt;

    // 'change' untuk select, 'input' untuk <input type="date"> — sebagian
    // peramban Android baru mengirim 'change' setelah picker ditutup.
    g.addEventListener('change', function() { dtKumpulkan(this); });
    g.addEventListener('input',  function() { dtKumpulkan(this); });
  }
}

/**
 * Trio di layar → input hidden. Lalu picu 'change' PADA input hidden supaya
 * handler lama (hitung durasi, penjaga override) tetap jalan seperti dulu.
 */
function dtKumpulkan(g) {
  var el = document.getElementById(g.getAttribute('data-dt'));
  if (!el) return;
  var t = g.querySelector('.dtTgl').value;
  var j = g.querySelector('.dtJam').value;
  var m = g.querySelector('.dtMnt').value;
  // Belum lengkap = kosong. Separuh terisi tidak boleh jadi waktu tebakan —
  // lebih baik validasi yang ada menolaknya daripada menyimpan jam ngawur.
  var baru = (t && j !== '' && m !== '') ? (t + 'T' + j + ':' + m) : '';
  if (el.value === baru) return;
  el.value = baru;
  el.dispatchEvent(new Event('change', {bubbles: true}));
}

/**
 * Satu-satunya cara sah menulis nilai picker.
 * @param {string} id  id input hidden
 * @param {string} s   "YYYY-MM-DDTHH:MM" (keluaran toDatetimeLocal) atau ''
 */
function dtSet(id, s) {
  var el = document.getElementById(id);
  if (!el) return;
  s = s ? String(s) : '';
  if (s.length > 16) s = s.substring(0, 16);   // buang detik bila terbawa
  el.value = s;
  var g = document.querySelector('.dt24[data-dt="' + id + '"]');
  if (!g) return;
  g.querySelector('.dtTgl').value = s ? s.substring(0, 10) : '';
  g.querySelector('.dtJam').value = s ? s.substring(11, 13) : '';
  g.querySelector('.dtMnt').value = s ? s.substring(14, 16) : '';
}
</script>

<style>
  /* Tanggal melebar, jam & menit sempit — dua kolom sempit berdampingan lebih
     cepat dipindai daripada satu kolom lebar berisi angka gabungan. */
  .dt24 { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px; align-items: center; }
  .dt24 .dtTgl { min-width: 0; }
  .dt24 .dtJam, .dt24 .dtMnt { min-width: 0; width: auto; padding-left: 8px; padding-right: 4px;
    font-variant-numeric: tabular-nums; text-align: center; }
  .dt24 .dtTitik { font-weight: 700; opacity: 0.55; }
  @media (max-width: 380px) { .dt24 { gap: 4px; } }
</style>
